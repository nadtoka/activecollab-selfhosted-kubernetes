apiVersion: v1
kind: ConfigMap
metadata:
  name: ac-nginx-conf
  namespace: activecollab
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /var/www/activecollab.example.com/public;
      index index.php index.html;


      # 1) Корінь сайту завжди через router.php
      # location = / {
      #  try_files /router.php =404;
      #}

      # 2) Якщо файл/каталог існує — віддаємо як є; інакше йдемо у fallback
      #location / {
      #  try_files $uri $uri/ @ac_router;
      #}

      # 3) Fallback з офіційними rewrite-ами ActiveCollab
      #location @ac_router {
      #  rewrite ^/assets/(.*)$ /assets/$1 last;
      #  rewrite ^/avatars/(.*)$ /avatars/$1 last;
      #  rewrite ^/wallpapers/(.*)$ /wallpapers/$1 last;
      #  rewrite ^/verify-existence$ /verify.php last;
      #  rewrite ^/proxy.php$ /proxy.php last;
      #  rewrite ^/api/v([0-9]*)/(.*)$ /api.php?path_info=$2&api_version=$1 last;
      #
      #  # На всяк випадок (для не-/) — основний роутер
      #  rewrite ^(.*)$ /router.php?path_info=$1 last;
      #}

      if (!-e $request_filename) {
        rewrite ^/assets/(.*)$ /assets/$1 last;
        rewrite ^/avatars/(.*)$ /avatars/$1 last;
        rewrite ^/wallpapers/(.*)$ /wallpapers/$1 last;
        rewrite ^/verify-existence$ /verify.php last;
        rewrite ^/proxy.php$ /proxy.php last;
        rewrite ^/api/v([0-9]*)/(.*)$ /api.php?path_info=$2&api_version=$1 last;
        rewrite ^$ /router.php last;
        rewrite ^(.*) /router.php?path_info=$1 last;
      }

      location ~ \.php$ {
        fastcgi_pass ac-php-fpm:9000;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        fastcgi_intercept_errors on;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;

      }

      client_max_body_size 64m;
      sendfile on;
    }
