apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ac-php-fpm-hpa
  namespace: activecollab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ac-php-fpm
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
